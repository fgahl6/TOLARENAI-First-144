#!/usr/bin/env node

// Build a simple, valid XML sitemap for /capstones
// NOTE: This script prints ONLY XML to stdout. No debug logs!

const fs = require("fs");
const path = require("path");

const BASE = "https://tolarenai.com";      // public site base
const WEB_DIR = "capstones";                // web folder name
const ABS_DIR = path.join(process.cwd(), WEB_DIR);

// Collect files we want to include (pdf, html, md). Skip hidden files.
function listFiles(dir) {
  return fs
    .readdirSync(dir, { withFileTypes: true })
    .filter((d) => d.isFile())
    .map((d) => d.name)
    .filter((n) => !n.startsWith("."))
    .filter((n) => /\.(pdf|html|md)$/i.test(n));
}

const files = listFiles(ABS_DIR);

// YYYY-MM-DD
const today = new Date().toISOString().slice(0, 10);

// Encode a single path segment (filenames) for URLs
function enc(name) {
  // encodeURIComponent but keep forward slashes if ever present
  return encodeURIComponent(name).replace(/%2F/gi, "/");
}

// Create one <url> entry
function urlEntry(loc, lastmod) {
  return [
    "  <url>",
    `    <loc>${loc}</loc>`,
    `    <lastmod>${lastmod}</lastmod>`,
    "    <changefreq>yearly</changefreq>",
    "  </url>",
  ].join("\n");
}

// Build entries
const entries = files
  .map((name) => {
    const loc = `${BASE}/${WEB_DIR}/${enc(name)}`;
    return urlEntry(loc, today);
  })
  .join("\n");

// Output ONLY valid XML
const xml =
  `<?xml version="1.0" encoding="UTF-8"?>\n` +
  `<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n` +
  `${entries}\n` +
  `</urlset>\n`;

process.stdout.write(xml);
