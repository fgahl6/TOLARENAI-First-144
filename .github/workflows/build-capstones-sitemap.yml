name: Build Capstones Sitemap

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run sitemap builder
        run: node scripts/build-capstones-sitemap.js > capstones-sitemap.xml

      - name: Commit sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capstones-sitemap.xml
          git commit -m "update capstones sitemap" || echo "No changes"
          git push
