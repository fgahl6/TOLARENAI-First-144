name: Build Capstones Sitemap

on:
  push:
    paths:
      - 'capstones/**'
      - 'scripts/build-capstones-sitemap.js'
  workflow_dispatch: {}   # lets you run it on-demand from Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # so git log works for lastmod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate capstones-sitemap.xml
        run: node scripts/build-capstones-sitemap.js

      - name: Commit sitemap if changed
        run: |
          if [[ -n "$(git status --porcelain capstones-sitemap.xml)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add capstones-sitemap.xml
            git commit -m "build: update capstones-sitemap.xml [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
