name: Build Quotes Sitemap

on:
  push:
    paths:
      - 'quotes/**'
      - 'scripts/build-quotes-sitemap.js'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate sitemap
        run: node scripts/build-quotes-sitemap.js > quotes/sitemap-quotes.xml

      - name: Commit sitemap if changed
        run: |
          if [[ -n "$(git status --porcelain quotes/sitemap-quotes.xml)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add quotes/sitemap-quotes.xml
            git commit -m "build: update quotes/sitemap-quotes.xml [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
