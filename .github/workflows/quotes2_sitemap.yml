name: Build quotes2 sitemap

on:
  push:
    branches: [ "main" ]
    paths:
      - "quotes2/**"
      - "!quotes2/quotes2-sitemap.xml"
      - "tools/build_quotes2_sitemap.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sitemap
        run: |
          python tools/build_quotes2_sitemap.py
          echo "First lines of output:"
          head -n 20 quotes2/quotes2-sitemap.xml || true

      - name: Commit sitemap if changed
        run: |
          if [[ -n "$(git status --porcelain quotes2/quotes2-sitemap.xml)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add quotes2/quotes2-sitemap.xml
            git commit -m "build: update quotes2/quotes2-sitemap.xml [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
