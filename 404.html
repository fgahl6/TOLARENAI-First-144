<!doctype html>
<meta charset="utf-8">
<title>Redirecting...</title>
<script>
(function () {
  var href = window.location.href;
  var path = window.location.pathname;

  // Split into folder path + filename
  var parts = path.split("/");
  var filename = parts.pop();       // last part = filename
  var folderPath = parts.join("/"); // folder path

  var lowerFolder = folderPath.toLowerCase();
  var lowerUrl = lowerFolder + "/" + filename;

  if (path !== lowerUrl) {
    window.location.replace(lowerUrl);
    return;
  }

  // fallback
  document.write(
    "<h1>Not found</h1><p>If you were trying a URL with capital letters, try the lowercase folder version.</p>"
  );
})();
</script>
