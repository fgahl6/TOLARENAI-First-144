<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>White Papers Archive</title>
  <meta name="description" content="Auto-updating archive of White Papers.">
  <link rel="canonical" href="https://tolarenai.com/white_papers/">
  <style>
    body { font-family: Georgia, serif; margin: 2rem auto; max-width: 800px; line-height: 1.6; color: #222; }
    h1 { text-align: center; margin-bottom: 1rem; }
    ul { list-style: none; padding: 0; }
    li { margin: 0.5rem 0; }
    a { color: #0645ad; text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer { margin-top: 3rem; font-size: .9rem; text-align: center; color: #555; }
  </style>
</head>
<body>
  <h1>White Papers</h1>
  <p class="intro">This list updates automatically from the sitemap.</p>

  <h2>Browse</h2>
  <ul id="white-papers-list"><noscript><li>Enable JavaScript to view the list.</li></noscript></ul>

  <script>
  async function renderFromSitemap({ sitemapUrl, pathFilter, containerId, limit = 100 }) {
    try {
      const text = await (await fetch(sitemapUrl, { cache: 'no-store' })).text();
      const xml  = new DOMParser().parseFromString(text, 'application/xml');
      const items = [...xml.querySelectorAll('url')].map(u => ({
        loc: u.querySelector('loc')?.textContent.trim() || '',
        lastmod: u.querySelector('lastmod')?.textContent.trim() || ''
      })).filter(x => x.loc.includes(pathFilter));
      items.sort((a,b)=>a.loc.localeCompare(b.loc,undefined,{numeric:true,sensitivity:'base'}));
      const UL = document.getElementById(containerId); UL.innerHTML='';
      items.slice(0, limit).forEach(it=>{
        const li=document.createElement('li'), a=document.createElement('a');
        a.href=it.loc; a.textContent=(it.loc.split('/').pop()||'').replace(/\.(pdf|md|html)$/i,'').replace(/-/g,' ');
        li.appendChild(a);
        if(it.lastmod){const s=document.createElement('small');s.style.marginLeft='.5rem';s.textContent=`(${it.lastmod})`;li.appendChild(s);}
        UL.appendChild(li);
      });
    } catch(e){ console.error('Sitemap load failed:', e); }
  }
  renderFromSitemap({
    sitemapUrl: '/white-papers-sitemap.xml',
    pathFilter: '/white_papers/',
    containerId: 'white-papers-list',
    limit: 100
  });
  </script>

  <footer><p>Back to <a href="/">TOLARENAI Home</a></p></footer>
</body>
</html>
