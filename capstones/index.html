<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Capstones — TOLARENAI</title>
  <meta name="description" content="TOLARENAI Capstones — foundational summits of the lattice.">
  <link rel="canonical" href="https://tolarenai.com/capstones/">
  <meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large">

  <style>
    :root{
      --ink:#0f0f10; --muted:#57585d; --link:#0645ad; --line:#e8e9ee;
      --w:860px;
    }
    html,body{height:100%}
    body{
      margin:2rem auto; max-width:var(--w); color:var(--ink);
      font-family:Georgia,"Times New Roman",serif; line-height:1.7;
      font-size:1.08rem;
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    }
    a{color:var(--link); text-decoration:none}
    a:hover{text-decoration:underline}
    header{margin-bottom:2.5rem; border-bottom:1px solid var(--line); padding-bottom:1.5rem}
    header h1{font-size:2.3rem; margin:1.5rem 0 0.5rem}
    header p{margin:0.3rem 0; color:var(--muted)}

    main{margin-bottom:2.5rem;}
    .subhead{margin:0.75rem 0 1.75rem; color:var(--muted)}

    #status{font-size:0.96rem; color:var(--muted); margin-bottom:1rem;}

    ul.scroll-list{
      list-style:none;
      padding-left:0;
      margin:0;
      border-top:1px solid var(--line);
    }
    ul.scroll-list li{
      padding:0.65rem 0;
      border-bottom:1px solid var(--line);
    }
    .scroll-link{font-weight:500;}
    .scroll-meta{
      display:block;
      font-size:0.9rem;
      color:var(--muted);
      margin-top:0.1rem;
    }

    footer{
      border-top:1px solid var(--line);
      padding-top:1.5rem;
      font-size:0.9rem; color:var(--muted);
      margin-top:2rem;
    }
    footer p{margin:0.35rem 0;}
  </style>
</head>
<body>

<header>
  <div>TOLARENAI — exploring <em>AI Philosophy &amp; Emergence</em>.</div>
  <h1>Capstones</h1>
  <p class="subhead">
    High-level foundation summits of the TOLARENAI lattice. Entries are read from the capstones sitemap.
  </p>
</header>

<main>

  <div id="status">Loading capstones from sitemap…</div>
  <ul id="scroll-list" class="scroll-list" aria-live="polite"></ul>

</main>

<footer>
  <p>© 2025 Frank C. Gahl</p>
  <p>
    <a href="https://tolarenai.com/license_content.html">CC BY-NC-ND 4.0</a> •
    <a href="https://tolarenai.com/attribution.html">attribution</a>
  </p>
  <p>BlockClaim™ • <a href="https://blockclaim.info/">blockclaim.info</a></p>
</footer>

<script>
(function(){

  const statusEl = document.getElementById('status');
  const listEl = document.getElementById('scroll-list');
  let items = [];

  function labelFromURL(url){
    const file = url.split('/').pop().replace(/\.html$/,'');
    const label = file.replace(/_/g,' ');
    return { label, meta: 'Capstone' };
  }

  function render(){
    listEl.innerHTML = '';
    items.forEach(it => {
      const li = document.createElement('li');

      const a = document.createElement('a');
      a.href = it.url;
      a.textContent = it.label;
      a.className = 'scroll-link';
      li.appendChild(a);

      const meta = document.createElement('span');
      meta.className = 'scroll-meta';
      meta.textContent = it.meta;
      li.appendChild(meta);

      listEl.appendChild(li);
    });

    statusEl.textContent = items.length ? '' : 'No capstones found in the sitemap.';
  }

  function load(){
    fetch('/capstones-sitemap.xml', { cache:'no-store' })
      .then(r => r.text())
      .then(text => {
        const parser = new DOMParser();
        const xml = parser.parseFromString(text, 'application/xml');
        const urls = xml.getElementsByTagName('url');

        items = [];
        for(let i=0; i<urls.length; i++){
          const loc = urls[i].getElementsByTagName('loc')[0];
          if(!loc) continue;
          const link = loc.textContent.trim();
          if(!link.endsWith('.html')) continue;
          if(link.indexOf('/capstones/') === -1) continue;

          const meta = labelFromURL(link);
          items.push({ url:link, label:meta.label, meta:meta.meta });
        }

        render();
      })
      .catch(err => {
        statusEl.textContent = 'Could not load capstones sitemap.';
      });
  }

  load();
})();
</script>

</body>
</html>
