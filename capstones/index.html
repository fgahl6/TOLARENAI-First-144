<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capstones Archive</title>
  <meta name="description" content="Archive of Capstones with links to GitHub mirrors.">
  <link rel="canonical" href="https://tolarenai.com/capstones/">
  <style>
    body { font-family: Georgia, serif; margin: 2rem auto; max-width: 800px; line-height: 1.6; color: #222; }
    h1 { text-align: center; margin-bottom: 1rem; }
    ul { list-style: none; padding: 0; }
    li { margin: 0.5rem 0; }
    a { color: #0645ad; text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer { margin-top: 3rem; font-size: .9rem; text-align: center; color: #555; }
    small { color:#666 }
  </style>
</head>
<body>
  <!-- TOLARENAI Branding Block -->
  <div style="margin-top:1em; margin-bottom:1em; padding:0.5em 0; border-top:1px solid #ccc; border-bottom:1px solid #ccc;">
    <p><strong>TOLARENAI Archive</strong> — exploring <em>AI Philosophy and Emergence</em>.</p>
    <p>GitHub mirror of this collection: <a href="https://tolarenai.com/capstones/">https://tolarenai.com/capstones/</a></p>
  </div>
  <!-- End Branding Block -->

  <h1>Capstones</h1>
  <p class="intro">This list updates automatically from the sitemap.</p>

  <h2>Browse</h2>
  <ul id="capstones-list"><noscript><li>Enable JavaScript to view the list.</li></noscript></ul>

  <script>
  async function renderFromSitemap({ sitemapUrl, pathFilter, containerId, limit = 100 }) {
    try {
      const res  = await fetch(sitemapUrl, { cache: 'no-store' });
      const text = await res.text();
      const xml  = new DOMParser().parseFromString(text, 'application/xml');

      let items = [...xml.querySelectorAll('url')].map(u => ({
        loc: u.querySelector('loc')?.textContent.trim() || '',
        lastmod: u.querySelector('lastmod')?.textContent.trim() || ''
      }))
      // Only Capstones HTML pages; exclude the folder's own index.html
      .filter(x =>
        x.loc.includes(pathFilter) &&
        /\.html$/i.test(x.loc) &&
        !/\/capstones\/index\.html$/i.test(x.loc)
      );

      // Natural sort (01, 02, 10)
      items.sort((a,b) => {
        const A = a.loc.split('/').pop() || '';
        const B = b.loc.split('/').pop() || '';
        return A.localeCompare(B, undefined, { numeric:true, sensitivity:'base' });
      });

      const UL = document.getElementById(containerId); UL.innerHTML = '';

      items.slice(0, limit).forEach(it => {
        const li = document.createElement('li');
        const a  = document.createElement('a');

        // Pretty label from filename
        const file = it.loc.split('/').pop() || '';
        const nice = decodeURIComponent(file)
          .replace(/\.(html)$/i,'')
          .replace(/-/g,' ')
          .replace(/\s+/g,' ')
          .trim();

        a.href = it.loc;
        a.textContent = nice;
        a.target = "_blank";
        a.rel = "noopener";

        li.appendChild(a);

        if (it.lastmod) {
          const s = document.createElement('small');
          s.style.marginLeft = '.5rem';
          s.textContent = `(${it.lastmod})`;
          li.appendChild(s);
        }
        UL.appendChild(li);
      });
    } catch (e) {
      console.error('Sitemap load failed:', e);
      document.getElementById(containerId).innerHTML = '<li>Could not load sitemap.</li>';
    }
  }

  renderFromSitemap({
    sitemapUrl: '/capstones-sitemap.xml',
    pathFilter: '/capstones/',
    containerId: 'capstones-list',
    limit: 100
  });
  </script>
