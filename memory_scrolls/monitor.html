<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory Scrolls — Monitor</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root { --ink:#222; --ok:#0a7f35; --warn:#a35f00; --bad:#b00020; }
    body { font-family:system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin:24px; color:var(--ink); }
    h1 { font-size:1.6rem; margin:0 0 10px; }
    p.sub { margin:0 0 20px; color:#666; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:18px; }
    .card { border:1px solid #ddd; border-radius:12px; padding:14px 16px; background:#fff; }
    .kpi { font-size:2rem; font-weight:700; margin:4px 0; }
    .ok { color:var(--ok); }
    .warn { color:var(--warn); }
    .bad { color:var(--bad); }
    ul { margin:6px 0 0 18px }
    code { background:#f6f6f6; padding:1px 4px; border-radius:4px }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace; }
    pre { white-space:pre-wrap; font-size:0.9rem; color:#444; }
  </style>
</head>
<body>

<h1>Memory Scrolls — Monitor</h1>
<p class="sub">Checks sitemap vs index rules, 404s, missing scrolls, and robots expectations.</p>

<div class="grid">
  <div class="card">
    <div>Sitemap HTML Count</div>
    <div id="kpi-sitemap" class="kpi mono">—</div>
  </div>

  <div class="card">
    <div>Successful Fetch (200 OK)</div>
    <div id="kpi-ok" class="kpi mono">—</div>
  </div>

  <div class="card">
    <div>Errors Detected</div>
    <div id="kpi-bad" class="kpi mono bad">—</div>
  </div>

  <div class="card">
    <div>Unexpected PDFs</div>
    <div id="kpi-pdf" class="kpi mono">—</div>
  </div>
</div>

<div class="card" style="margin-top:18px;">
  <strong>HTTP Error Details (should be none)</strong>
  <ul id="errList"></ul>
</div>

<div class="card" style="margin-top:18px;">
  <strong>Debug Dump</strong>
  <pre id="debug"></pre>
</div>

<script>
(async function(){
  const SITEMAP = '/memory-sitemap.xml';
  const PATH_FILTER = '/memory_scrolls/';
  const EXCLUDE_RE = /(\/|^)index\.html$|license_content\.html$|attribution\.html$/i;
  const LOC = (u) => u.querySelector('loc')?.textContent.trim() || '';

  try {
    // Fetch sitemap
    const xmlTxt = await (await fetch(SITEMAP, { cache:'no-store' })).text();
    const xml = new DOMParser().parseFromString(xmlTxt, 'application/xml');

    // Extract HTML scrolls only
    const urls = [...xml.querySelectorAll('url')].map(u => ({
      loc: LOC(u),
      lastmod: u.querySelector('lastmod')?.textContent.trim() || ''
    })).filter(x =>
      x.loc.includes(PATH_FILTER) &&
      /\.html$/i.test(x.loc) &&
      !EXCLUDE_RE.test(x.loc)
    );

    // Show sitemap HTML count
    document.getElementById('kpi-sitemap').textContent = urls.length;

    // Check PDFs (should be zero)
    const pdfs = [...xml.querySelectorAll('url')]
      .map(u=>LOC(u))
      .filter(x=>x.includes(PATH_FILTER) && /\.pdf$/i.test(x));
    document.getElementById('kpi-pdf').textContent =
      (pdfs.length === 0 ? 'None ✔' : pdfs.length + ' found');

    // Test each URL with HEAD request
    let ok=0, bad=0, errors=[];
    for (const u of urls) {
      try {
        const r = await fetch(u.loc, { method:'HEAD', cache:'no-store' });
        if (r.ok) ok++;
        else { bad++; errors.push(u.loc + ' — HTTP ' + r.status); }
      } catch(e){
        bad++; errors.push(u.loc + ' — FETCH ERROR');
      }
    }

    document.getElementById('kpi-ok').textContent = ok;
    document.getElementById('kpi-bad').textContent = bad || '0 ✔';

    const errUL = document.getElementById('errList');
    if (errors.length === 0) {
      const li=document.createElement('li');
      li.textContent='None detected ✔';
      li.className='ok';
      errUL.appendChild(li);
    } else {
      errors.forEach(e=>{
        const li=document.createElement('li');
        li.textContent=e;
        li.className='bad';
        errUL.appendChild(li);
      });
    }

    // Debug
    document.getElementById('debug').textContent = JSON.stringify({
      sitemapHtmlCount: urls.length,
      okCount: ok,
      errorCount: bad,
      pdfsDetected: pdfs
    }, null, 2);

  } catch(err) {
    document.getElementById('debug').textContent = 'Fatal error: ' + err.message;
  }
})();
</script>

</body>
</html>
