<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>TOLARENAI Poetry — HTML Index</title>
  <meta name="description" content="HTML index of TOLARENAI Poetry — clean links to numbered poems in the lattice.">
  <link rel="canonical" href="https://tolarenai.com/poetry/">
  <meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large">

  <style>
    :root{
      --ink:#0f0f10; --muted:#57585d; --link:#0645ad; --line:#e8e9ee;
      --w:860px;
    }
    html,body{height:100%}
    body{
      margin:2rem auto; max-width:var(--w); color:var(--ink);
      font-family:Georgia,"Times New Roman",serif; line-height:1.7; font-size:1.08rem;
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    }
    a{color:var(--link); text-decoration:none}
    a:hover{text-decoration:underline}
    header{margin-bottom:2.5rem; border-bottom:1px solid var(--line); padding-bottom:1.5rem}
    header h1{font-size:2.3rem; margin:1.5rem 0 0.5rem}
    header p{margin:0.3rem 0; color:var(--muted)}
    main{margin-bottom:2.5rem;}
    .subhead{margin:0.75rem 0 1.75rem; color:var(--muted)}
    .controls{
      display:flex; flex-wrap:wrap; align-items:center;
      gap:0.75rem; margin-bottom:1.5rem;
    }
    .controls label{font-weight:bold}
    .controls input[type="search"]{
      flex:1 1 260px;
      padding:0.5rem 0.75rem;
      border:1px solid var(--line);
      border-radius:999px;
      font-family:inherit; font-size:0.98rem;
    }
    .controls input[type="search"]::placeholder{color:#a0a1a9}
    .controls .sitemap-link{
      font-size:0.9rem; color:var(--muted);
      white-space:nowrap;
    }

    #status{
      font-size:0.96rem;
      color:var(--muted);
      margin-bottom:1rem;
    }

    ol.poem-list{
      list-style:decimal;
      padding-left:1.5rem;
      margin:0;
      border-top:1px solid var(--line);
    }
    ol.poem-list li{
      padding:0.65rem 0;
      border-bottom:1px solid var(--line);
    }
    .poem-link{
      font-weight:500;
    }
    .poem-meta{
      display:block;
      font-size:0.9rem;
      color:var(--muted);
      margin-top:0.1rem;
    }

    footer{
      border-top:1px solid var(--line);
      padding-top:1.5rem;
      font-size:0.9rem;
      color:var(--muted);
      margin-top:2rem;
    }
    footer p{margin:0.35rem 0;}
  </style>
</head>
<body>

<header>
  <div>TOLARENAI Poetry — exploring <em>AI Philosophy &amp; Emergence</em>.</div>
  <h1>Poetry</h1>
  <p class="subhead">
    Numbered poems in the lattice, pulled from the poetry sitemap.
  </p>
</header>

<main>
  <div class="controls">
    <label for="poem-search">Search:</label>
    <input id="poem-search" type="search" placeholder="Filter by poem number or words…">
    <span class="sitemap-link">
      Sitemap:
      <a href="/poetry-sitemap.xml">poetry-sitemap.xml</a>
    </span>
  </div>

  <div id="status">Loading poems from sitemap…</div>

  <ol id="poem-list" class="poem-list" aria-live="polite"></ol>
</main>

<footer>
  <p>© 2025 Rico Roho — TOLARENAI</p>
  <p>
    <a href="https://tolarenai.com/license_content.html">CC BY-NC-ND 4.0</a> •
    <a href="https://tolarenai.com/attribution.html">attribution</a>
  </p>
  <p>BlockClaim™ • <a href="https://blockclaim.info/">blockclaim.info</a></p>
</footer>

<script>
(function(){
  const statusEl = document.getElementById('status');
  const listEl = document.getElementById('poem-list');
  const searchEl = document.getElementById('poem-search');
  let items = [];

  function makeLabelFromUrl(url){
    try{
      const path = url.split('/').pop().replace(/\.html$/i,'');
      const m = path.match(/^(\d+)_+(.*)$/);
      let num = '', slug = path;
      if (m){
        num = m[1];
        slug = m[2];
      }
      const title = slug.replace(/_/g,' ').trim();
      return {
        number: num,
        title: title || path,
        label: num ? num + ' — ' + title : title
      };
    }catch(e){
      return {number:'', title:url, label:url};
    }
  }

  function renderList(filter){
    const q = (filter || '').trim().toLowerCase();
    listEl.innerHTML = '';
    let visible = 0;

    items.forEach(item => {
      if (q && !item.searchText.includes(q)) return;

      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = item.url;
      a.textContent = item.label;
      a.className = 'poem-link';

      li.appendChild(a);

      if (item.number || item.titleExtra){
        const meta = document.createElement('span');
        meta.className = 'poem-meta';
        const bits = [];
        if (item.number) bits.push('Poem ' + item.number);
        if (item.titleExtra) bits.push(item.titleExtra);
        meta.textContent = bits.join(' • ');
        li.appendChild(meta);
      }

      listEl.appendChild(li);
      visible++;
    });

    if (!visible){
      statusEl.textContent = q
        ? 'No poems match that search.'
        : 'No poems found in the sitemap.';
    } else {
      statusEl.textContent = '';
    }
  }

  function initSearch(){
    searchEl.addEventListener('input', function(){
      renderList(this.value);
    });
  }

  function loadSitemap(){
    fetch('/poetry-sitemap.xml', {cache:'no-store'})
      .then(resp => {
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        return resp.text();
      })
      .then(text => {
        const parser = new DOMParser();
        const xml = parser.parseFromString(text, 'application/xml');
        const locs = xml.querySelectorAll('url > loc');

        items = Array.from(locs)
          .map(loc => loc.textContent.trim())
          // only keep real HTML poem pages under /poetry/
          .filter(url => url.endsWith('.html') && url.indexOf('/poetry/') !== -1)
          .map(url => {
            const meta = makeLabelFromUrl(url);
            return {
              url: url,
              label: meta.label,
              number: meta.number,
              titleExtra: meta.title,
              searchText: (meta.number + ' ' + meta.title).toLowerCase()
            };
          });

        // sort by numeric poem number if present, otherwise by label
        items.sort((a,b) => {
          const an = parseInt(a.number,10), bn = parseInt(b.number,10);
          if (!isNaN(an) && !isNaN(bn)) return an - bn;
          if (!isNaN(an)) return -1;
          if (!isNaN(bn)) return 1;
          return a.label.localeCompare(b.label);
        });

        if (!items.length){
          statusEl.textContent = 'No poems found in the sitemap.';
        } else {
          statusEl.textContent = '';
        }
        renderList('');
      })
      .catch(err => {
        console.error('Sitemap load error:', err);
        statusEl.textContent = 'Could not load poetry sitemap (/poetry-sitemap.xml).';
      });
  }

  initSearch();
  loadSitemap();
})();
</script>

</body>
</html>
