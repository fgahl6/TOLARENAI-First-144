<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Poetry Archive</title>
  <meta name="description" content="Collection of Poetry Scrolls from the AI Age of Discovery.">
  <link rel="canonical" href="https://tolarenai.com/poetry/">

  <style>
    body {
      font-family: Georgia, serif;
      margin: 2rem auto;
      max-width: 800px;
      line-height: 1.6;
      color: #222;
    }
    h1 { text-align: center; margin-bottom: 1rem; }
    ul { list-style: none; padding: 0; }
    ul li { margin: 0.5rem 0; }
    a { color: #0645ad; text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer { margin-top: 3rem; font-size: 0.9rem; text-align: center; color: #555; }
  </style>
</head>
  <!-- TOLARENAI Branding Block -->
<div style="margin-top:1em; margin-bottom:1em; padding:0.5em 0; border-top:1px solid #ccc; border-bottom:1px solid #ccc;">
  <p><strong>TOLARENAI Archive</strong> — exploring <em>AI Philosophy and Emergence</em>.</p>
  <p>GitHub mirror of this collection: <a href="https://tolarenai.com/poetry/">https://tolarenai.com/poetry/</a></p>
</div>
<!-- End Branding Block -->
<body>

  <h1>Poetry</h1>
  <p class="intro">
    A curated archive of Poetry Scrolls. This page auto-updates from the sitemap.
  </p>

  <h2>Browse Poems</h2>
  <ul id="poetry-list">
    <noscript><li>Enable JavaScript to view the poetry list.</li></noscript>
  </ul>

  <script>
  async function renderFromSitemap({ sitemapUrl, pathFilter, containerId, limit = 50 }) {
    try {
      const res  = await fetch(sitemapUrl, { cache: 'no-store' });
      const text = await res.text();
      const xml  = new DOMParser().parseFromString(text, 'application/xml');

      const items = [...xml.querySelectorAll('url')]
        .map(url => ({
          loc: url.querySelector('loc')?.textContent.trim() || '',
          lastmod: url.querySelector('lastmod')?.textContent.trim() || ''
        }))
        .filter(x => x.loc.includes(pathFilter));

      items.sort((a, b) => a.loc.localeCompare(b.loc, undefined, { numeric: true, sensitivity: 'base' }));

      const UL = document.getElementById(containerId);
      UL.innerHTML = '';

      items.slice(0, limit).forEach(it => {
        const li = document.createElement('li');
        const a  = document.createElement('a');
        a.href = it.loc;
        a.textContent = decodeURIComponent(it.loc.split('/').pop().replace(/\.(pdf|md|html)$/i,'').replace(/-/g,' '));
        li.appendChild(a);
        if (it.lastmod) {
          const small = document.createElement('small');
          small.style.marginLeft = '0.5rem';
          small.textContent = `(${it.lastmod})`;
          li.appendChild(small);
        }
        UL.appendChild(li);
      });
    } catch (e) {
      console.error('Sitemap load failed:', e);
    }
  }

  renderFromSitemap({
    sitemapUrl: '/poetry-sitemap.xml',
    pathFilter: '/poetry/',
    containerId: 'poetry-list',
    limit: 50
  });
  </script>

  <footer>
    <p>Back to <a href="/">TOLARENAI Home</a></p>
  </footer>

</body>
</html>
