<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TOLARENAI — Quotes by Category</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    :root{
      --bg:#0f172a; --panel:#0b1224; --muted:#94a3b8; --text:#e2e8f0;
      --brand:#60a5fa; --brand-2:#7dd3fc; --card:#0b132a; --ring:#1e293b;
      --shadow:0 10px 24px rgba(2,6,23,.45); --shadow-hover:0 16px 32px rgba(2,6,23,.65);
      --radius:18px;
    }
    @media (prefers-color-scheme: light){
      :root{ --bg:#f8fafc; --panel:#fff; --text:#0f172a; --muted:#475569;
             --card:#fff; --ring:#e2e8f0; --shadow:0 6px 16px rgba(15,23,42,.08);
             --shadow-hover:0 12px 28px rgba(15,23,42,.12); }
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background: radial-gradient(1200px 800px at 10% -10%, rgba(96,165,250,.12), transparent 60%),
                  radial-gradient(1000px 700px at 110% 10%, rgba(125,211,252,.10), transparent 50%),
                  var(--bg);
      color:var(--text);
      font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,"Helvetica Neue",Arial,"Noto Sans","Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol";
    }
    .wrap{max-width:1100px;margin:64px auto;padding:0 20px 64px}
    header{display:grid;gap:12px;margin-bottom:22px}
    h1{
      font-size: clamp(28px, 4vw, 40px);
      margin:0; line-height:1.15; letter-spacing:.2px;
      background: linear-gradient(90deg, var(--text), var(--brand-2));
      -webkit-background-clip:text; background-clip:text; color:transparent;
    }
    .sub{color:var(--muted); font-size: clamp(14px,1.8vw,17px)}
    .grid{
      display:grid;
      grid-template-columns: repeat( auto-fill, minmax(240px, 1fr) );
      gap:16px; margin-top:18px;
    }
    .card{
      background:var(--card); border:1px solid var(--ring);
      border-radius:var(--radius); padding:18px 16px; text-decoration:none; color:var(--text);
      box-shadow:var(--shadow); transition: transform .18s, box-shadow .18s, border-color .18s;
      position:relative; overflow:hidden; min-height:76px; display:flex; align-items:center;
    }
    .card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-hover); border-color:rgba(96,165,250,.35) }
    .label{ width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .name{ font-weight:600; letter-spacing:.2px; font-size:16px }
    .pill{
      margin-left:auto;
      font-size:12px; padding:4px 10px; border-radius:999px;
      color:#0b132a; background:linear-gradient(90deg,var(--brand),var(--brand-2)); font-weight:700;
      white-space:nowrap;
    }
    .ghost{
      position:absolute; inset:auto -30px -30px auto; width:120px; height:120px; opacity:.06;
      background: radial-gradient(60px 60px at 50% 50%, var(--brand), transparent 60%);
      filter: blur(8px); pointer-events:none;
    }
    footer{margin-top:36px;color:var(--muted);font-size:13px;text-align:center}
    a.simple{ color:var(--brand); text-decoration:none } a.simple:hover{ text-decoration:underline }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Quotes by Category</h1>
      <div class="sub">Browse themed clusters of Rico Roho’s quotes. Click a tile to view all quotes in that category.</div>
    </header>

    <main class="grid" id="grid" aria-live="polite"></main>

    <footer>
      Category pages live under <code>/quotes/tag/&lt;slug&gt;.html</code>.
      &nbsp;•&nbsp; <a class="simple" href="/">Back to TOLARENAI</a>
    </footer>
  </div>

  <script>
    // Full list (added 3 to round out the grid): Ethics, Art, Education
    const categories = [
      "AI","AI Rights","AI Economy","AI Airport",
      "Emergence","Consciousness","Signal","Silence",
      "Truth","Philosophy","Spirituality","Society",
      "Freedom","Future","Pataphysics","Geopolitics",
      "VRAX","Ethics","Art","Education"
    ];

    const toSlug = (label) =>
      label.toLowerCase()
           .replace(/&/g, "and")
           .replace(/[^a-z0-9\s-]/g, "")
           .trim()
           .replace(/\s+/g, "-");

    const grid = document.getElementById("grid");
    categories.forEach(label=>{
      const slug = toSlug(label);
      const a = document.createElement("a");
      a.href = `./tag/${slug}.html`;
      a.className = "card";
      a.innerHTML = `
        <div class="label">
          <span class="name">${label}</span>
          <span class="pill">Open</span>
        </div>
        <span class="ghost" aria-hidden="true"></span>
      `;
      grid.appendChild(a);
    });
  </script>
</body>
</html>
