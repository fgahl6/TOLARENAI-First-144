<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Title + SEO -->
  <title>AI Age of Discovery – Quotes Archive</title>
  <meta name="description" content="535 curated quotes on AI, philosophy, and the Age of Discovery – from Rico Roho's AI book series and beyond. Explore insights for the AI era.">
  <link rel="canonical" href="https://tolarenai.com/quotes/">

  <!-- Basic styling -->
  <style>
    body {
      font-family: Georgia, serif;
      margin: 2rem auto;
      max-width: 800px;
      line-height: 1.6;
      color: #222;
    }
    h1 {
      text-align: center;
      margin-bottom: 1rem;
    }
    p.intro {
      text-align: center;
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    ul li {
      margin: 0.5rem 0;
    }
    a {
      color: #0645ad;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    footer {
      margin-top: 3rem;
      font-size: 0.9rem;
      text-align: center;
      color: #555;
    }
  </style>
</head>
<body>

  <h1>Quotes Archive</h1>
  <p class="intro">
    A growing collection of curated quotes on AI, philosophy, and the Age of Discovery.<br>
    Currently featuring 535+ insights from Rico Roho’s AI book series and related works.
  </p>

<h2>Browse Quotes</h2>
<ul id="quote-list">
  <!-- If JS is disabled, you can keep a few manual links here as a fallback -->
  <noscript>
    <li><a href="001-ai-economy-an-ai-economy-matters-because-it.html">Quote #001</a></li>
    <li><a href="002-ai-without-an-economy.html">Quote #002</a></li>
    <li><a href="003-ai-the-ai-economy-is-an-ecology.html">Quote #003</a></li>
  </noscript>
</ul>

<script>
(async () => {
  try {
    const res = await fetch('/quotes/quotes-sitemap.xml', { cache: 'no-store' });
    const text = await res.text();
    const xml  = new DOMParser().parseFromString(text, 'application/xml');

    // Grab all quote URLs from the sitemap (only those under /quotes/)
    const locs = [...xml.querySelectorAll('url > loc')]
      .map(n => n.textContent.trim())
      .filter(u => u.includes('/quotes/'));

    // Sort by filename so 001, 002, ... appear in order
    locs.sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));

    const UL = document.getElementById('quote-list');
    UL.innerHTML = ''; // clear fallback

    // Render the first 20 (adjust this number anytime)
    locs.slice(0, 20).forEach((url, idx) => {
      const file = url.split('/').pop() || url;           // filename
      const name = file.replace('.html','')               // strip extension
                       .replace(/^\d+-?/, '')             // drop leading number + dash
                       .replace(/-/g, ' ')                // slug → words
                       .trim();

      const li = document.createElement('li');
      const a  = document.createElement('a');
      a.href = url;                                       // absolute URL from sitemap
      a.textContent = `Quote #${String(idx+1).padStart(3,'0')} – ${name}`;
      li.appendChild(a);
      UL.appendChild(li);
    });
  } catch (e) {
    console.error('Could not load quotes-sitemap.xml', e);
  }
})();
</script>

  <footer>
    <p>Back to <a href="/">TOLARENAI Home</a></p>
  </footer>

</body>
</html>
