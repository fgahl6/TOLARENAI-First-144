<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TOLARENAI — Quotes by Category</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    :root{
      --bg: #0f172a;          /* slate-900 */
      --panel:#0b1224;        /* deep panel */
      --muted:#94a3b8;        /* slate-400 */
      --text:#e2e8f0;         /* slate-200 */
      --brand:#60a5fa;        /* blue-400 */
      --brand-2:#7dd3fc;      /* sky-300 */
      --card:#0b132a;         /* card bg */
      --ring:#1e293b;         /* slate-800 */
      --shadow: 0 10px 24px rgba(2, 6, 23, .45);
      --shadow-hover: 0 16px 32px rgba(2, 6, 23, .65);
      --radius: 18px;
    }
    @media (prefers-color-scheme: light){
      :root{
        --bg:#f8fafc; --panel:#ffffff; --text:#0f172a; --muted:#475569;
        --card:#ffffff; --ring:#e2e8f0; --shadow:0 6px 16px rgba(15,23,42,.08);
        --shadow-hover:0 12px 28px rgba(15,23,42,.12);
      }
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background: radial-gradient(1200px 800px at 10% -10%, rgba(96,165,250,.12), transparent 60%),
                  radial-gradient(1000px 700px at 110% 10%, rgba(125,211,252,.10), transparent 50%),
                  var(--bg);
      color:var(--text);
      font: 16px/1.6 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol";
    }
    .wrap{
      max-width: 1100px;
      margin: 64px auto;
      padding: 0 20px 64px;
    }
    header{
      display:grid; gap:14px; margin-bottom:22px;
    }
    h1{
      font-size: clamp(28px, 4vw, 40px);
      letter-spacing:.2px;
      margin:0;
      line-height:1.15;
      background: linear-gradient(90deg, var(--text), var(--brand-2));
      -webkit-background-clip:text; background-clip:text; color:transparent;
    }
    .sub{
      color:var(--muted);
      font-size: clamp(14px, 1.8vw, 17px);
    }

    .toolbar{
      display:flex; gap:12px; align-items:center; margin:18px 0 26px;
      flex-wrap:wrap;
    }
    .search{
      flex:1 1 280px;
      display:flex; align-items:center; gap:10px;
      background:var(--panel); border:1px solid var(--ring);
      border-radius: 14px; padding: 10px 14px;
      box-shadow: var(--shadow);
    }
    .search input{
      width:100%; border:0; outline:0; background:transparent; color:var(--text);
      font-size:15px;
    }
    .hint{ color:var(--muted); font-size:13px }

    .grid{
      display:grid;
      grid-template-columns: repeat( auto-fill, minmax(220px, 1fr) );
      gap:16px;
    }
    .card{
      position:relative;
      background:var(--card);
      border:1px solid var(--ring);
      border-radius: var(--radius);
      padding:18px 16px;
      text-decoration:none; color:var(--text);
      box-shadow: var(--shadow);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      overflow:hidden;
    }
    .card:hover{
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
      border-color: rgba(96,165,250,.35);
    }
    .label{
      display:flex; align-items:center; gap:10px;
      font-weight:600; letter-spacing:.2px;
      font-size:16px;
    }
    .pill{
      font-size:12px; padding:3px 8px; border-radius:999px;
      color:#0b132a; background: linear-gradient(90deg, var(--brand), var(--brand-2));
      font-weight:700;
    }
    .ghost{
      position:absolute; inset:auto -30px -30px auto;
      width:120px; height:120px; opacity:.06;
      background: radial-gradient(60px 60px at 50% 50%, var(--brand), transparent 60%);
      filter: blur(8px);
      pointer-events:none;
    }
    footer{
      margin-top: 36px; color:var(--muted); font-size:13px;
      text-align:center;
    }
    a.simple{ color:var(--brand); text-decoration: none; }
    a.simple:hover{ text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Quotes by Category</h1>
      <div class="sub">Browse themed clusters of Rico Roho’s quotes. Click a tile to view all quotes in that category.</div>
    </header>

    <div class="toolbar">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M21 21l-4.3-4.3M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15z" stroke="currentColor" stroke-width="1.6" opacity=".6"/>
        </svg>
        <input id="q" type="search" placeholder="Filter categories…" aria-label="Filter categories" />
      </div>
      <div class="hint">Tip: type to filter · press <kbd>Enter</kbd> on a result</div>
    </div>

    <main class="grid" id="grid" aria-live="polite"></main>

    <footer>
      Powered by a tiny static index. Category pages live under <code>/quotes/tag/&lt;slug&gt;.html</code>.
      &nbsp;•&nbsp; <a class="simple" href="/">Back to TOLARENAI</a>
    </footer>
  </div>

  <script>
    // List of categories you’ve created under /quotes/tag/
    const categories = [
      "AI","AI Rights","AI Economy","AI Airport",
      "Emergence","Consciousness","Signal","Silence","Truth",
      "Philosophy","Spirituality","Society","Freedom","Future",
      "Pataphysics","Geopolitics","VRAX"
    ];

    // Create a safe slug like your filenames (lowercase, dash-separated)
    const toSlug = (label) =>
      label.toLowerCase()
           .replace(/&/g, "and")
           .replace(/[^a-z0-9\s-]/g, "")
           .trim()
           .replace(/\s+/g, "-");

    // Render cards
    const grid = document.getElementById("grid");
    function render(list){
      grid.innerHTML = "";
      list.forEach(label => {
        const slug = toSlug(label);
        const a = document.createElement("a");
        a.href = `./tag/${slug}.html`;
        a.className = "card";
        a.innerHTML = `
          <div class="label">
            <span>${label}</span>
            <span class="pill">Open</span>
          </div>
          <span class="ghost" aria-hidden="true"></span>
        `;
        grid.appendChild(a);
      });
      if(list.length === 0){
        grid.innerHTML = `<div class="card" style="grid-column:1 / -1"><div class="label">No categories match your filter.</div></div>`;
      }
    }
    render(categories);

    // Simple client-side filter
    const input = document.getElementById("q");
    input.addEventListener("input", () => {
      const term = input.value.toLowerCase().trim();
      if(!term){ render(categories); return; }
      const filtered = categories.filter(c => c.toLowerCase().includes(term));
      render(filtered);
    });

    // Enter opens first visible result
    input.addEventListener("keydown", (e)=>{
      if(e.key === "Enter"){
        const first = grid.querySelector("a.card");
        if(first) first.click();
      }
    });
  </script>
</body>
</html>
