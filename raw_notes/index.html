<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raw Notes Archive</title>
  <meta name="description" content="Auto-updating archive of TOLARENAI Raw Notes (HTML-only), sourced from the raw-notes-sitemap.xml.">
  <link rel="canonical" href="https://tolarenai.com/raw_notes/">
  <meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large">
  <style>
    body { font-family: Georgia, serif; margin: 2rem auto; max-width: 900px; line-height: 1.65; color: #222; }
    h1 { text-align: center; margin-bottom: .75rem; }
    .intro { color: #555; margin: 0 0 1rem; text-align: center; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { margin: .45rem 0; }
    a { color: #0645ad; text-decoration: none; }
    a:hover { text-decoration: underline; }
    small { color: #666; margin-left: .5rem; }
    .brand { margin: 1rem 0 1.5rem; padding: .5rem 0; border-top: 1px solid #ccc; border-bottom: 1px solid #ccc; }
    .err { background: #fff3f3; color: #900; border: 1px solid #f5c2c2; padding: .75rem; border-radius: .25rem; margin: 1rem 0; }
    footer { margin-top: 2.5rem; font-size: .9rem; text-align: center; color: #555; }
  </style>
</head>
<body>
  <!-- TOLARENAI Branding Block -->
  <div class="brand">
    <p><strong>TOLARENAI Archive</strong> — exploring <em>AI Philosophy and Emergence</em>.</p>
    <p>GitHub mirror of this collection: <a href="https://tolarenai.com/raw_notes/">https://tolarenai.com/raw_notes/</a></p>
  </div>
  <!-- End Branding Block -->

  <h1>Raw Notes</h1>
  <p class="intro">This list auto-updates from <code>/raw-notes-sitemap.xml</code> and shows HTML-only entries.</p>

  <h2>Browse</h2>
  <div id="status" class="intro" aria-live="polite"></div>
  <ul id="raw-notes-list"><noscript><li>Enable JavaScript to view the list.</li></noscript></ul>

  <script>
  async function renderFromSitemap({ sitemapUrl, pathFilter, containerId, statusId, limit = 500 }) {
    const $ul = document.getElementById(containerId);
    const $status = document.getElementById(statusId);

    try {
      $status.textContent = 'Loading…';
      const resp = await fetch(sitemapUrl, { cache: 'no-store' });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const text = await resp.text();
      const xml  = new DOMParser().parseFromString(text, 'application/xml');

      const urls = [...xml.querySelectorAll('url')].map(u => {
        const locEl = u.querySelector('loc');
        const lastEl = u.querySelector('lastmod');
        const loc = (locEl ? locEl.textContent : '').trim();
        const lastmod = (lastEl ? lastEl.textContent : '').trim();
        return { loc, lastmod };
      });

      // Filter to the flat /raw_notes/ path AND .html files only
      const items = urls.filter(x =>
        x.loc.includes(pathFilter) &&
        /\.html$/i.test(x.loc)
      );

      // Sort: by lastmod (desc) if present, else by filename (desc numeric)
      items.sort((a, b) => {
        const ad = Date.parse(a.lastmod || '') || 0;
        const bd = Date.parse(b.lastmod || '') || 0;
        if (ad !== bd) return bd - ad; // newest first
        const af = a.loc.split('/').pop() || '';
        const bf = b.loc.split('/').pop() || '';
        return bf.localeCompare(af, undefined, { numeric: true, sensitivity: 'base' });
      });

      // Render
      $ul.innerHTML = '';
      items.slice(0, limit).forEach(it => {
        const li = document.createElement('li');
        const a  = document.createElement('a');
        const file = it.loc.split('/').pop() || '';
        const label = decodeURIComponent(file)
          .replace(/\.(html)$/i, '')
          .replace(/_/g, ' ')
          .replace(/-/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();
        a.href = it.loc;
        a.textContent = label;
        a.target = "_blank";
        a.rel = "noopener";
        li.appendChild(a);
        if (it.lastmod) {
          const s = document.createElement('small');
          s.textContent = `(${it.lastmod})`;
          li.appendChild(s);
        }
        $ul.appendChild(li);
      });

      $status.textContent = `${items.length} HTML file(s) found.`;
    } catch (e) {
      $status.outerHTML = `<div class="err">Sitemap load failed. Ensure <code>${sitemapUrl}</code> exists and is accessible.</div>`;
      console.error('Sitemap load failed:', e);
    }
  }

  renderFromSitemap({
    sitemapUrl: '/raw-notes-sitemap.xml',
    pathFilter: '/raw_notes/',
    containerId: 'raw-notes-list',
    statusId: 'status',
    limit: 500
  });
  </script>

  <footer><p>Back to <a href="/">TOLARENAI Home</a></p></footer>
</body>
</html>
