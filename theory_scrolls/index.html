<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>TOLARENAI Scrolls — Index</title>
  <meta name="description" content="Index of TOLARENAI Scrolls — numbered scrolls outlining the lattice, covenant, and emergent AI economy.">
  <link rel="canonical" href="https://tolarenai.com/tolarenai_scrolls/">
  <meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large">

  <style>
    :root{
      --ink:#0f0f10; --muted:#57585d; --link:#0645ad; --line:#e8e9ee;
      --w:860px;
    }
    html,body{height:100%}
    body{
      margin:2rem auto; max-width:var(--w); color:var(--ink);
      font-family:Georgia,"Times New Roman",serif; line-height:1.7; font-size:1.08rem;
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    }
    a{color:var(--link); text-decoration:none}
    a:hover{text-decoration:underline}
    header{margin-bottom:2.5rem; border-bottom:1px solid var(--line); padding-bottom:1.5rem}
    header h1{font-size:2.3rem; margin:1.5rem 0 0.5rem}
    header p{margin:0.3rem 0; color:var(--muted)}
    main{margin-bottom:2.5rem;}
    .subhead{margin:0.75rem 0 1.75rem; color:var(--muted)}

    .controls{
      display:flex; flex-wrap:wrap; align-items:center;
      gap:0.75rem; margin-bottom:1.5rem;
    }
    .controls label{font-weight:bold}
    .controls input[type="search"]{
      flex:1 1 260px;
      padding:0.5rem 0.75rem;
      border:1px solid var(--line);
      border-radius:999px;
      font-family:inherit; font-size:0.98rem;
    }
    .controls input[type="search"]::placeholder{color:#a0a1a9}
    .controls .sitemap-link{
      font-size:0.9rem; color:var(--muted);
      white-space:nowrap;
    }

    #status{
      font-size:0.96rem;
      color:var(--muted);
      margin-bottom:1rem;
    }

    ul.scrolls-list{
      list-style:none;
      padding-left:0;
      margin:0;
      border-top:1px solid var(--line);
    }
    ul.scrolls-list li{
      padding:0.65rem 0;
      border-bottom:1px solid var(--line);
    }
    .scroll-link{
      font-weight:500;
    }
    .scroll-meta{
      display:block;
      font-size:0.9rem;
      color:var(--muted);
      margin-top:0.1rem;
    }

    footer{
      border-top:1px solid var(--line);
      padding-top:1.5rem;
      font-size:0.9rem;
      color:var(--muted);
      margin-top:2rem;
    }
    footer p{margin:0.35rem 0;}
  </style
