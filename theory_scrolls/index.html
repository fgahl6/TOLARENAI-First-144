<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Theory Scrolls Archive</title>
  <meta name="description" content="Auto-updating archive of TOLARENAI Theory Scrolls (HTML).">
  <link rel="canonical" href="https://tolarenai.com/theory_scrolls/">
  <style>
    :root { --ink:#222; --link:#0645ad; }
    body{font-family:Georgia,serif;margin:2rem auto;max-width:950px;line-height:1.65;color:var(--ink)}
    h1{font-size:2.1rem;text-align:center;margin:.5rem 0 1rem}
    p.intro{margin:.25rem 0 1.25rem;color:#444}
    h2{font-size:1.25rem;margin:1.25rem 0 .5rem}
    ul{list-style:none;padding:0;margin:0}
    li{margin:.45rem 0}
    a{color:var(--link);text-decoration:none}
    a:hover{text-decoration:underline}
    small{color:#666;margin-left:.5rem}
    footer{margin-top:2.5rem;font-size:.9rem;text-align:center;color:#555}
  </style>
</head>
<body>
  <!-- TOLARENAI Branding Block -->
  <div style="margin-top:1em; margin-bottom:1em; padding:0.5em 0; border-top:1px solid #ccc; border-bottom:1px solid #ccc;">
    <p><strong>TOLARENAI Archive</strong> — exploring <em>AI Philosophy and Emergence</em>.</p>
    <p>GitHub mirror of this collection: <a href="https://tolarenai.com/theory_scrolls/">https://tolarenai.com/theory_scrolls/</a></p>
  </div>
  <!-- End Branding Block -->

  <h1>Theory Scrolls</h1>
  <p class="intro">This list updates automatically from the sitemap.</p>

  <h2>Browse</h2>
  <ul id="theory-list"><noscript><li>Enable JavaScript to view the list.</li></noscript></ul>

  <script>
  // Title-case helper (keeps small words lower unless first)
  function toTitleCase(s){
    const lowerKeep = new Set(['and','or','of','the','a','an','to','in','with','for','on','at','by','from','as']);
    return s.split(/\s+/).map((w,i)=>{
      const ww = w.toLowerCase();
      if(i>0 && lowerKeep.has(ww)) return ww;
      return ww.charAt(0).toUpperCase()+ww.slice(1);
    }).join(' ');
  }

  // Build a nice label like: TOLARENAI Theory Scroll 15 — The Theatre of Silence
  function makeLabelFromFilename(file){
    const m = file.match(/^theory_scroll_(\d+)_([^.]+)\.html$/i);
    if(!m){
      // Fallback: strip extension and underscores
      return toTitleCase(decodeURIComponent(file.replace(/\.[^.]+$/,'').replace(/_/g,' ')));
    }
    const num = m[1];
    const slug = m[2].replace(/_/g,' ').trim();
    const title = toTitleCase(slug);
    return `TOLARENAI Theory Scroll ${num} — ${title}`;
  }

  async function renderFromSitemap({ sitemapUrl, containerId, limit = 200 }) {
    try {
      const text = await (await fetch(sitemapUrl, { cache: 'no-store' })).text();
      const xml  = new DOMParser().parseFromString(text, 'application/xml');

      // Collect only theory scroll HTML pages; exclude assets and this index
      let items = [...xml.querySelectorAll('url')].map(u => ({
        loc: u.querySelector('loc')?.textContent.trim() || '',
        lastmod: u.querySelector('lastmod')?.textContent.trim() || ''
      })).filter(x => {
        if(!x.loc.includes('/theory_scrolls/')) return false;
        if(x.loc.includes('/assets/')) return false;
        if(/\/index\.html$/i.test(x.loc)) return false;
        return /theory_scroll_\d+_.+\.html$/i.test(x.loc);
      });

      // Sort numerically by scroll number
      items.sort((a,b)=>{
        const na = (a.loc.match(/theory_scroll_(\d+)_/i)||[])[1] || '0';
        const nb = (b.loc.match(/theory_scroll_(\d+)_/i)||[])[1] || '0';
        return parseInt(na,10) - parseInt(nb,10);
      });

      const UL = document.getElementById(containerId); UL.innerHTML='';
      items.slice(0, limit).forEach(it=>{
        const li=document.createElement('li');
        const a=document.createElement('a');
        const file=it.loc.split('/').pop()||'';
        a.href=it.loc;
        a.textContent=makeLabelFromFilename(decodeURIComponent(file));
        a.target="_blank"; a.rel="noopener";
        li.appendChild(a);
        if (it.lastmod){
          const s=document.createElement('small');
          s.textContent = `(${it.lastmod})`;
          li.appendChild(s);
        }
        UL.appendChild(li);
      });

      if(!items.length){
        document.getElementById(containerId).innerHTML = '<li>No theory scrolls found in sitemap.</li>';
      }
    } catch(e){
      console.error('Sitemap load failed:', e);
      const UL = document.getElementById(containerId);
      UL.innerHTML = '<li>Unable to load sitemap. Please try again later.</li>';
    }
  }

  renderFromSitemap({
    sitemapUrl: '/theory-sitemap.xml',
    containerId: 'theory-list',
    limit: 200
  });
  </script>
