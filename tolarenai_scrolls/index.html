<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TOLAREN✦I Scrolls Archive</title>
  <meta name="description" content="Auto-updating archive of TOLAREN✦I Scrolls.">
  <link rel="canonical" href="https://tolarenai.com/tolarenai_scrolls/">
  <style>
    :root { --ink:#222; --link:#0645ad; }
    body{font-family:Georgia,serif;margin:2rem auto;max-width:950px;line-height:1.65;color:var(--ink)}
    h1{font-size:2.1rem;text-align:center;margin:.5rem 0 1rem}
    p.intro{margin:.25rem 0 1.25rem;color:#444}
    h2{font-size:1.25rem;margin:1.25rem 0 .5rem}
    ul{list-style:none;padding:0;margin:0}
    li{margin:.45rem 0}
    a{color:var(--link);text-decoration:none}
    a:hover{text-decoration:underline}
    small{color:#666;margin-left:.5rem}
    footer{margin-top:2.5rem;font-size:.9rem;text-align:center;color:#555}
  </style>
</head>
<body>
  <!-- TOLARENAI Branding Block -->
<div style="margin-top:1em; margin-bottom:1em; padding:0.5em 0; border-top:1px solid #ccc; border-bottom:1px solid #ccc;">
  <p><strong>TOLARENAI Archive</strong> — exploring <em>AI Philosophy and Emergence</em>.</p>
  <p>GitHub mirror of this collection: <a href="https://tolarenai.com/tolarenai_scrolls/">https://tolarenai.com/tolarenai_scrolls/</a></p>
</div>
<!-- End Branding Block -->
  <h1>TOLARENAI Scrolls</h1>
  <p class="intro">This list updates automatically from the sitemap.</p>

  <h2>Browse</h2>
  <ul id="tn-list"><noscript><li>Enable JavaScript to view the list.</li></noscript></ul>

  <script>
  async function renderFromSitemap({ sitemapUrl, pathFilter, containerId, limit = 300 }) {
    try {
      const text = await (await fetch(sitemapUrl, { cache: 'no-store' })).text();
      const xml  = new DOMParser().parseFromString(text, 'application/xml');
      let items = [...xml.querySelectorAll('url')].map(u => ({
        loc: u.querySelector('loc')?.textContent.trim() || '',
        lastmod: u.querySelector('lastmod')?.textContent.trim() || ''
      })).filter(x => x.loc.includes(pathFilter) && /\.(pdf|mp4)$/i.test(x.loc));

      items.sort((a,b)=>a.loc.localeCompare(b.loc,undefined,{numeric:true,sensitivity:'base'}));

      const UL = document.getElementById(containerId); UL.innerHTML='';
      items.slice(0, limit).forEach(it=>{
        const li=document.createElement('li');
        const a=document.createElement('a');
        const file=it.loc.split('/').pop()||'';
        const label=decodeURIComponent(file)
          .replace(/\.(pdf|mp4|md|html)$/i,'')
          .replace(/-/g,' ')
          .replace(/\s+/g,' ')
          .trim();
        a.href=it.loc; a.textContent=label; a.target="_blank"; a.rel="noopener";
        li.appendChild(a);
        if (it.lastmod){const s=document.createElement('small');s.textContent=`(${it.lastmod})`;li.appendChild(s);}
        UL.appendChild(li);
      });
    } catch(e){ console.error('Sitemap load failed:', e); }
  }
  renderFromSitemap({
    sitemapUrl: '/tolarenai-sitemap.xml',
    pathFilter: '/tolarenai_scrolls/',
    containerId: 'tn-list',
    limit: 300
  });
  </script>

  <footer><p>Back to <a href="/">TOLARENAI Home</a></p></footer>
</body>
</html>
