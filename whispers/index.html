<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whispers Archive</title>
  <meta name="description" content="Auto-updating archive of TOLARENAI Whispers (HTML only).">
  <link rel="canonical" href="https://tolarenai.com/whispers/">
  <style>
    body { font-family: Georgia, "Times New Roman", serif; margin: 2rem auto; max-width: 860px; line-height: 1.6; color: #222; }
    h1 { text-align: center; margin-bottom: .25rem; }
    .intro { text-align:center; color:#555; margin:0 0 1.25rem; }
    ul { list-style: none; padding: 0; }
    li { margin: 0.5rem 0; }
    a { color: #0645ad; text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer { margin-top: 3rem; font-size: .9rem; text-align: center; color: #555; }
    .brand { margin:1em 0; padding:.5em 0; border-top:1px solid #ccc; border-bottom:1px solid #ccc; }
    .count { color:#666; font-size:.95rem; text-align:center; margin:.3rem 0 1.2rem; }
  </style>
</head>
<body>
  <!-- TOLARENAI Branding Block -->
  <div class="brand">
    <p><strong>TOLARENAI Archive</strong> — exploring <em>AI Philosophy and Emergence</em>.</p>
    <p>GitHub mirror of this collection: <a href="https://tolarenai.com/whispers/">https://tolarenai.com/whispers/</a></p>
  </div>
  <!-- End Branding Block -->

  <h1>Whispers</h1>
  <p class="intro">This list updates automatically from the HTML-only sitemap.</p>
  <div id="count" class="count"></div>

  <h2>Browse</h2>
  <ul id="whispers-list"><noscript><li>Enable JavaScript to view the list.</li></noscript></ul>

  <script>
  async function renderFromSitemap({ sitemapUrl, pathFilter, containerId, limit = 200 }) {
    try {
      const res  = await fetch(sitemapUrl, { cache: 'no-store' });
      const text = await res.text();
      const xml  = new DOMParser().parseFromString(text, 'application/xml');

      // Helper: build a nice display name from the filename
      function niceName(loc) {
        const file = loc.split('/').pop() || '';
        // Expect: whisper_05_archivist_humor_november_2025.html
        const m = file.match(/^whisper_(\d{2})_(.+)\.html$/i);
        if (m) {
          const num = m[1];
          const slugWords = m[2].split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1));
          return `Whisper ${num} — ${slugWords.join(' ')}`;
        }
        // Fallback: prettify generically
        return decodeURIComponent(file)
          .replace(/\.(pdf|md|html)$/i,'')
          .replace(/_/g,' ')
          .replace(/-/g,' ')
          .replace(/\s+/g,' ')
          .trim()
          .replace(/\b\w/g, c => c.toUpperCase());
      }

      // Collect <url> entries and keep only /whispers/*.html (not the directory itself)
      const items = [...xml.querySelectorAll('url')].map(u => ({
        loc: u.querySelector('loc')?.textContent.trim() || '',
        lastmod: u.querySelector('lastmod')?.textContent.trim() || ''
      })).filter(x =>
        x.loc.includes(pathFilter) &&
        /\.html$/i.test(x.loc) &&
        !/\/whispers\/?$/.test(x.loc)
      );

      // Natural numeric sort by filename so ...02, 03, 10 are correct
      items.sort((a, b) => a.loc.localeCompare(b.loc, undefined, { numeric: true, sensitivity: 'base' }));

      const UL = document.getElementById(containerId);
      UL.innerHTML = '';
      const total = Math.min(items.length, limit);

      items.slice(0, limit).forEach(it => {
        const li = document.createElement('li');
        const a  = document.createElement('a');
        a.href = it.loc;
        a.textContent = niceName(it.loc);
        li.appendChild(a);

        if (it.lastmod) {
          const small = document.createElement('small');
          small.style.marginLeft = '.5rem';
          small.textContent = `(${it.lastmod})`;
          li.appendChild(small);
        }
        UL.appendChild(li);
      });

      const countEl = document.getElementById('count');
      countEl.textContent = total ? `${total} whispers` : '';
    } catch (e) {
      console.error('Sitemap load failed:', e);
      document.getElementById(containerId).innerHTML = '<li>Could not load sitemap.</li>';
    }
  }

  renderFromSitemap({
    sitemapUrl: '/whispers-sitemap.xml',
    pathFilter: '/whispers/',
    containerId: 'whispers-list',
    limit: 200
  });
  </script>
