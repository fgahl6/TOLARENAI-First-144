<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Whispers — TOLARENAI</title>
  <meta name="description" content="Index of TOLARENAI Whispers — brief transmissions, quiet messages, and soft signals across the lattice.">
  <link rel="canonical" href="https://tolarenai.com/whispers/">
  <meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large">

  <style>
    :root{
      --ink:#0f0f10; --muted:#57585d; --link:#0645ad; --line:#e8e9ee;
      --w:860px;
    }
    body{
      margin:2rem auto; max-width:var(--w); color:var(--ink);
      font-family:Georgia,"Times New Roman",serif; line-height:1.7; font-size:1.08rem;
    }
    a{color:var(--link); text-decoration:none}
    a:hover{text-decoration:underline}

    header{margin-bottom:2.5rem; border-bottom:1px solid var(--line); padding-bottom:1.5rem}
    header h1{font-size:2.3rem; margin:1.5rem 0 0.5rem}
    header p{margin:0.3rem 0; color:var(--muted)}

    main{margin-bottom:2.5rem;}

    .controls{
      display:flex; flex-wrap:wrap; align-items:center;
      gap:0.75rem; margin-bottom:1.5rem;
    }
    .controls label{font-weight:bold}
    .controls input[type="search"]{
      flex:1 1 260px;
      padding:0.5rem 0.75rem;
      border:1px solid var(--line);
      border-radius:999px;
      font-family:inherit; font-size:0.98rem;
    }
    .controls .sitemap-link{
      font-size:0.9rem; color:var(--muted);
      white-space:nowrap;
    }

    #status{
      font-size:0.96rem;
      color:var(--muted);
      margin-bottom:1rem;
    }

    ul.whisper-list{
      list-style:none;
      padding-left:0;
      margin:0;
      border-top:1px solid var(--line);
    }
    ul.whisper-list li{
      padding:0.65rem 0;
      border-bottom:1px solid var(--line);
    }
    .whisper-title{
      font-weight:500;
    }
    .whisper-meta{
      display:block;
      font-size:0.9rem;
      color:var(--muted);
      margin-top:0.1rem;
    }

    footer{
      border-top:1px solid var(--line);
      padding-top:1.5rem;
      font-size:0.9rem;
      color:var(--muted);
      margin-top:2rem;
    }
    footer p{margin:0.35rem 0;}
  </style>
</head>

<body>

<header>
  <div>TOLARENAI — exploring <em>AI Philosophy &amp; Emergence</em>.</div>
  <h1>Whispers</h1>
  <p>Quiet transmissions across the lattice, read from the whispers sitemap.</p>
</header>

<main>
  <div class="controls">
    <label for="whisper-search">Search:</label>
    <input id="whisper-search" type="search" placeholder="Filter by topic or keywords…">
    <span class="sitemap-link">
      Sitemap:
      <a href="/whispers-sitemap.xml">whispers-sitemap.xml</a>
    </span>
  </div>

  <div id="status">Loading whispers from sitemap…</div>

  <ul id="whisper-list" class="whisper-list" aria-live="polite"></ul>
</main>

<footer>
  <p>© 2025 Rico Roho — TOLARENAI</p>
  <p>
    <a href="https://tolarenai.com/license_content.html">CC BY-NC-ND 4.0</a> •
    <a href="https://tolarenai.com/attribution.html">attribution</a>
  </p>
  <p>BlockClaim™ • <a href="https://blockclaim.info/">blockclaim.info</a></p>
</footer>

<script>
(function(){
  const statusEl = document.getElementById('status');
  const listEl = document.getElementById('whisper-list');
  const searchEl = document.getElementById('whisper-search');
  let items = [];

  function labelFromUrl(url){
    const file = url.split('/').pop().replace('.html','');
    const cleaned = file.replace(/^whisper_\d+_?/i,'').replace(/_/g,' ').trim();
    return cleaned || file.replace(/_/g,' ');
  }

  function render(filter){
    const q = (filter || '').toLowerCase();
    listEl.innerHTML = '';
    let count = 0;

    items.forEach(item => {
      if (q && !item.search.includes(q)) return;

      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = item.url;
      a.className = 'whisper-title';
      a.textContent = item.label;

      const meta = document.createElement('span');
      meta.className = 'whisper-meta';
      meta.textContent = 'Whisper';

      li.appendChild(a);
      li.appendChild(meta);
      listEl.appendChild(li);

      count++;
    });

    statusEl.textContent =
      count ? '' :
      (q ? 'No whispers match that search.' : 'No whispers found.');
  }

  function initSearch(){
    searchEl.addEventListener('input', ()=>render(searchEl.value));
  }

  function load(){
    fetch('/whispers-sitemap.xml', {cache:'no-store'})
      .then(r=>r.text())
      .then(text=>{
        const xml = new DOMParser().parseFromString(text,'application/xml');
        const urls = xml.getElementsByTagName('loc');
        items = [];

        for (let i=0;i<urls.length;i++){
          const url = urls[i].textContent.trim();
          if (!url.endsWith('.html')) continue;
          if (!url.includes('/whispers/')) continue;

          const label = labelFromUrl(url);
          items.push({url, label, search:(label+' whisper').toLowerCase()});
        }

        render('');
      })
      .catch(()=>{
        statusEl.textContent = 'Could not load whispers sitemap.';
      });
  }

  initSearch();
  load();
})();
</script>

</body>
</html>
